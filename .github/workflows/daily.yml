name: 毎日の売買

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 平日 22:30 UTC（日本時間の翌朝7:30。米国市場が閉まったあと）
  workflow_dispatch:           # 手動でも動かせる

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 株価を取得して売買を計算する
        run: python trade.py
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
      - name: 結果を保存する
        run: |
          git config user.name "stock-lab-bot"
          git config user.email "stock-lab-bot@users.noreply.github.com"
          git add prices.json data.json
          git diff --cached --quiet || git commit -m "売買結果を更新"
          git push
